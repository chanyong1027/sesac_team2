<svg width="1600" height="1360" viewBox="0 0 1600 1360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gateway Request Flow</title>
  <desc id="desc">LuminaOps gateway request flow with API key validation, prompt version lookup, provider call, retry and failover, logging, and response return.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="mainBox" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="successBox" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="errorBox" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF1F2"/>
      <stop offset="1" stop-color="#FFE4E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10V0Z" fill="#94A3B8"/>
    </marker>
    <style>
      .title { font: 700 42px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .subtitle { font: 500 20px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .box-title { font: 700 25px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .box-text { font: 500 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .pill-text { font: 700 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .label-text { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="1600" height="1360" fill="url(#bg)"/>
  <text x="800" y="84" text-anchor="middle" class="title">Gateway Request Flow</text>
  <text x="800" y="118" text-anchor="middle" class="subtitle">Stable LLM request flow with retry, failover, and trace-based logging</text>

  <text x="800" y="168" text-anchor="middle" class="label-text">LUMINAOPS MVP</text>

  <g filter="url(#shadow)">
    <rect x="470" y="190" width="660" height="92" rx="24" fill="url(#mainBox)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="500" y="228" class="box-title">외부 서비스</text>
    <text x="500" y="258" class="box-text">POST /v1/chat/completions</text>

    <rect x="470" y="328" width="660" height="110" rx="24" fill="url(#mainBox)" stroke="#C4B5FD" stroke-width="2"/>
    <text x="500" y="366" class="box-title">Gateway 진입</text>
    <text x="500" y="396" class="box-text">X-API-Key 검증</text>
    <text x="500" y="422" class="box-text">traceId 생성</text>

    <rect x="470" y="484" width="660" height="110" rx="24" fill="url(#mainBox)" stroke="#FDBA74" stroke-width="2"/>
    <text x="500" y="522" class="box-title">Prompt / Version 조회</text>
    <text x="500" y="552" class="box-text">active 버전 조회</text>
    <text x="500" y="578" class="box-text">provider / model 정책 로드</text>

    <rect x="470" y="640" width="660" height="110" rx="24" fill="url(#mainBox)" stroke="#93C5FD" stroke-width="2"/>
    <text x="500" y="678" class="box-title">Spring AI 기반 LLM 호출</text>
    <text x="500" y="708" class="box-text">primary provider 호출</text>
    <text x="500" y="734" class="box-text">OpenAI / Anthropic / Gemini</text>

    <rect x="640" y="796" width="320" height="72" rx="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="800" y="840" text-anchor="middle" class="box-title">성공 여부 판단</text>
  </g>

  <path d="M800 282V328" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 438V484" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 594V640" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 750V796" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M800 868V894H390V950" stroke="#94A3B8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 868V894H1210V950" stroke="#94A3B8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="180" y="886" width="140" height="44" rx="22" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="250" y="914" text-anchor="middle" class="pill-text" fill="#047857">성공</text>

    <rect x="180" y="950" width="420" height="110" rx="24" fill="url(#successBox)" stroke="#34D399" stroke-width="2"/>
    <text x="210" y="988" class="box-title">로그 저장</text>
    <text x="210" y="1018" class="box-text">request_logs 저장</text>
    <text x="210" y="1044" class="box-text">응답 메타데이터 기록</text>

    <rect x="1000" y="886" width="140" height="44" rx="22" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="1070" y="914" text-anchor="middle" class="pill-text" fill="#BE123C">실패</text>

    <rect x="1000" y="950" width="420" height="110" rx="24" fill="url(#errorBox)" stroke="#FB7185" stroke-width="2"/>
    <text x="1030" y="988" class="box-title">Retry / Failover</text>
    <text x="1030" y="1018" class="box-text">timeout / 5xx -&gt; retry</text>
    <text x="1030" y="1044" class="box-text">429 / model not found -&gt; failover</text>

    <rect x="180" y="1140" width="420" height="110" rx="24" fill="url(#successBox)" stroke="#34D399" stroke-width="2"/>
    <text x="210" y="1178" class="box-title">응답 반환</text>
    <text x="210" y="1208" class="box-text">표준 응답 반환</text>
    <text x="210" y="1234" class="box-text">traceId / usedModel / usage 포함</text>

    <rect x="1000" y="1106" width="420" height="110" rx="24" fill="url(#errorBox)" stroke="#FB7185" stroke-width="2"/>
    <text x="1030" y="1144" class="box-title">로그 저장</text>
    <text x="1030" y="1174" class="box-text">request_logs 저장</text>
    <text x="1030" y="1200" class="box-text">request_log_attempts 저장</text>

    <rect x="1000" y="1262" width="420" height="110" rx="24" fill="url(#errorBox)" stroke="#FB7185" stroke-width="2"/>
    <text x="1030" y="1300" class="box-title">응답 반환</text>
    <text x="1030" y="1330" class="box-text">표준 오류 응답 반환</text>
    <text x="1030" y="1356" class="box-text">error_code / traceId 포함</text>
  </g>

  <path d="M390 1060V1140" stroke="#10B981" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1210 1060V1106" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1210 1216V1262" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
